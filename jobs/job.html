<!DOCTYPE html>

</head>
<body>

<nav class="nav" aria-label="Primary">
  <div class="nav-inner wrap">
    <a href="../index.html" class="nav-logo" aria-label="Orbint — home">
      <img src="../assets/images/logo-black.png" alt="Orbint" width="70" height="38">
    </a>
    <div class="nav-links">
      <a class="label" href="../index.html#technology">Technology</a>
      <a class="label" href="../index.html#career">Career</a>
      <a class="label" href="../index.html#news">News</a>
      <a class="label" href="../index.html#contact">Contact</a>
    </div>
    <button id="hamburger" class="hamburger" aria-label="Menu" aria-expanded="false" aria-controls="mobile-menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<div id="mobile-menu" class="mobile-menu" hidden>
  <a class="label" href="../index.html#technology">Technology</a>
  <a class="label" href="../index.html#career">Career</a>
  <a class="label" href="../index.html#news">News</a>
  <a class="label" href="../index.html#contact">Contact</a>
</div>

<main id="main">

<div class="page-head wrap">
  <a class="page-back label" href="../index.html#career"><span aria-hidden="true">&larr;</span> All open positions</a>
  <div class="grid">
    <div class="col-margin">
      <p class="label" id="job-kicker">Open position</p>
      <p class="label label--muted" id="job-location"></p>
    </div>
    <h1 class="page-title col-wide" id="job-title">Loading&hellip;</h1>
  </div>
</div>

<div class="page-body wrap">
  <div class="grid job-layout">
    <article class="copy col-text" id="job-body"></article>
    <aside class="job-aside" id="job-aside" hidden>
      <dl>
        <div><dt class="label label--muted">Location</dt><dd id="sidebar-location">&mdash;</dd></div>
        <div><dt class="label label--muted">Type</dt><dd id="sidebar-type">&mdash;</dd></div>
      </dl>
      <a class="btn" id="job-apply" href="mailto:career@orbint.de">Apply</a>
    </aside>
  </div>
</div>

</main>

<footer class="site-footer wrap field-ink">
  <div class="grid footer-grid">
    <div class="footer-brand">
      <img src="../assets/images/logo-white.png" alt="Orbint" width="81" height="44">
    </div>
    <nav class="footer-nav" aria-label="Sections">
      <p class="label label--muted">Site</p>
      <a class="footer-link" href="../index.html#technology">Technology</a>
      <a class="footer-link" href="../index.html#career">Career</a>

    </nav>
    <nav class="footer-legal" aria-label="Legal">
      <p class="label label--muted">Legal</p>
      <a class="footer-link" href="../impressum.html">Impressum</a>
      <a class="footer-link" href="../privacy.html">Privacy</a>
    </nav>
    <div class="footer-end">
      <p class="label label--muted">Orbint GmbH</p>
      <p class="footer-note">Lilienthalstraße 9<br>85579 Neubiberg<br>Germany<br><br>&copy; 2026</p>
    </div>
  </div>
</footer>

<script src="../js/script.js" defer></script>
<script>
(function () {
  var slug = new URLSearchParams(location.search).get('slug');
  if (!slug) { location.replace('../index.html#career'); return; }

  fetch('posts/' + slug + '.json')
    .then(function (r) { if (!r.ok) throw new Error('not found'); return r.json(); })
    .then(function (job) {
      document.title = job.title + ' | Orbint';
      document.getElementById('job-kicker').textContent = job.type || 'Open position';
      document.getElementById('job-title').textContent = job.title;
      document.getElementById('job-location').textContent = job.location || '';
      document.getElementById('job-body').innerHTML = job.body;
      document.getElementById('sidebar-location').textContent = job.location || '\u2014';
      document.getElementById('sidebar-type').textContent = job.type || '\u2014';
      var apply = document.getElementById('job-apply');
      apply.href = 'mailto:career@orbint.de?subject=' + encodeURIComponent('Application: ' + job.title);
      document.getElementById('job-aside').hidden = false;
    })
    .catch(function () {
      document.getElementById('job-title').textContent = 'Position not found';
      document.getElementById('job-kicker').textContent = 'Careers';
      document.getElementById('job-body').innerHTML =
        '<p>This position is no longer listed. See all <a class="label" href="../index.html#career">open positions</a>.</p>';
    });
})();
</script>
</body>
</html>
